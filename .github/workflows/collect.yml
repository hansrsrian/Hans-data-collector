name: Torn Foreign Stock Collector

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: torn-foreign-stock-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect foreign stock
        env:
          TORN_INTEL_KEY: ${{ secrets.TORN_INTEL_KEY }}
        run: python collector.py

      - name: Save measurements
        run: |
          git config user.name "torn-stock-bot"
          git config user.email "torn-stock-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Foreign stock measurement"
          git pull --rebase origin main
          git push
